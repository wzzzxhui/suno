# 由 install.sh 生成到 /etc/nginx/conf.d/suno.conf
# HTTPS 由 certbot --nginx 自动追加，不用手写

# 对外接口
server {
    listen 80;
    server_name __API_DOMAIN__;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# 运营后台：hash 路由，静态文件直接托管；接口走相对路径 /admin/api
server {
    listen 80;
    server_name __ADMIN_DOMAIN__;
    client_max_body_size 20m;
    root __INSTALL_DIR__/admin;
    index index.html;

    location /admin/api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 带 hash 的构建产物长期缓存，index.html 不缓存，发版后立即生效
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

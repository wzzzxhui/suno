# 部署参数：install.sh / upgrade.sh 都从这里读取，首次部署前改好
# 注意：本文件是 bash 语法，等号两边不要有空格

# 安装目录与运行用户
INSTALL_DIR=/opt/suno
RUN_USER=suno

# 三个站点的域名（DNS 需已解析到本机）
API_DOMAIN=api.example.com
ADMIN_DOMAIN=admin.example.com
OPEN_DOMAIN=open.example.com

# 是否部署开放平台公开站（Nuxt），不需要改成 0
ENABLE_OPEN=1

# MySQL 业务账号密码（库名固定为 suno_open，由 schema.sql 决定）
DB_USER=suno
DB_PASS=请改成强密码

# 数据库备份保留天数
BACKUP_KEEP_DAYS=14

# 服务器时区：DSN 使用 loc=Local，时区不对会导致流水时间、统计报表错 8 小时；留空则不修改
TIMEZONE=Asia/Shanghai
